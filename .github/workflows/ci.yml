name: CAPSULA alpha validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest
      - run: pytest -q
      - run: python -m compileall -q .
      - run: node --check static/app.js
      - run: python smoke_worker.py
      - run: python release_validate.py
      - run: python scripts/verify_release_manifest.py
      - name: Dedicated VM runtime source contracts
        run: python scripts/validate.py
        working-directory: runtimes/dot
