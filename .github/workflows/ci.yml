name: CAPSULA alpha and cluster validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: capsula
          POSTGRES_PASSWORD: ci-only-not-production
          POSTGRES_DB: capsula
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capsula -d capsula"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CAPSULA_CLUSTER_DATABASE_URL: postgresql://capsula:ci-only-not-production@127.0.0.1:5432/capsula
      CAPSULA_API_KEY: ci-admin-not-production-only
      CAPSULA_DATA: /tmp/capsula-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - run: python -m compileall -q .
      - run: node --check static/app.js
      - run: node --check static/capsules_ui.js
      - run: python smoke_worker.py
      - name: Execute a real disposable Docker file-processing capsule
        run: |
          docker pull python:3.12-alpine
          python scripts/smoke_capsule_docker.py
      - run: python release_validate.py
      - run: python scripts/verify_release_manifest.py
      - name: Dedicated VM runtime source contracts
        run: python scripts/validate.py
        working-directory: runtimes/dot
      - name: Benchmark PostgreSQL queue with concurrent clients
        run: python scripts/benchmark_cluster.py
        env:
          CAPSULA_BENCH_JOBS: '40'
          CAPSULA_BENCH_WORKERS: '4'
          CAPSULA_BENCH_RECEIPT: cluster-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: capsula-postgres-queue-benchmark
          path: cluster-benchmark.json
