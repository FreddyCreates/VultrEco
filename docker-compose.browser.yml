# EXPERIMENTAL: dedicated browser worker VM only. Require external network egress proxy/firewall.
# NOT security-approved for hostile multitenant browsing. Chromium --no-sandbox is not acceptable
# without an independently enforced VM/microVM boundary.
services:
  worker-browser:
    build:
      context: .
      dockerfile: browser.Dockerfile
    restart: unless-stopped
    environment:
      CAPSULA_WORKER_TOKEN: ${CAPSULA_WORKER_TOKEN:?set unique worker token}
      CAPSULA_BROWSER_ALLOWLIST: ${CAPSULA_BROWSER_ALLOWLIST:?set explicit domains}
    ports:
      - "127.0.0.1:8082:8081"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1200m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,nosuid,size=256m
