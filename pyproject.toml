[build-system]
requires = ["setuptools>=74", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capsula"
version = "0.8.0a1"
description = "CAPSULA — the computer cloud for autonomous work"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2",
  "pydantic==2.11.4", "cryptography>=44,<47",
  "httpx==0.28.1", "psycopg[binary]>=3.2,<3.4",
  "PyJWT[crypto]>=2.10,<3"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["capsula*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
